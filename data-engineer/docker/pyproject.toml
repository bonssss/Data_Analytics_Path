[project]
name = "docker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bons", email = "bons6710hos@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "pandas>=3.0.5",
    "psycopg[binary,pool]",
    "pyarrow>=25.0.1",
    "sqlalchemy",
    "tqdm>=4.70.0",
]

[project.scripts]
docker = "docker:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.5.0",
]
